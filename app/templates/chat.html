<!DOCTYPE html>
<html>
<head>
    <title>Chat - Practice Math</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <!-- KaTeX for rendering LaTeX math equations -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <!-- JSXGraph for interactive geometry diagrams -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraph.css">
</head>
<body>
    <div id="chat-header">
        <h2>Practice Math - AI Tutor</h2>
        <div>
            <button id="new-conversation-button" onclick="clearHistory()">New Conversation</button>
            <form method="POST" action="{{ url_for('auth.logout') }}" style="display:inline;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>

    <div id="chat-container">
        <!-- Chat messages -->
        <ul id="messages"></ul>

        <!-- Message input -->
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Ask a math question...">
            <button id="send-button" onclick="sendMessage()">Send</button>
        </div>

        <!-- Image upload form -->
        <form action="{{ url_for('main.upload_file') }}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/png, image/jpeg">
            <input type="submit" value="Upload">
        </form>
    </div>

    <div id="loading" style="display: none;">
        <p>Thinking...</p>
    </div>

    <!-- Socket.IO client library -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <!-- Markdown rendering and HTML sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <!-- KaTeX for rendering LaTeX math equations -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <!-- JSXGraph for interactive geometry diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraphcore.js"></script>
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
